name: Qt release gates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to rebuild and attach to its GitHub Release.
        required: false
        type: string

concurrency:
  group: qt-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate_release:
    name: Validate release context
    runs-on: ubuntu-24.04
    outputs:
      checkout_ref: ${{ steps.context.outputs.checkout_ref }}
      publish: ${{ steps.context.outputs.publish }}
      release_tag: ${{ steps.context.outputs.release_tag }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Resolve and validate release context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]{2}\.[0-9]{4}\.(0[1-9]|[1-9][0-9])$ ]]; then
            echo "VERSION must use the UTC release format YY.MMDD.NN: $version" >&2
            exit 1
          fi

          release_tag=""
          publish="false"
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="$PUSH_REF_NAME"
            publish="true"
          elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            publish="true"
          fi

          if [[ -n "$release_tag" ]]; then
            if [[ "$release_tag" != "v$version" ]]; then
              echo "Release tag $release_tag does not match VERSION v$version" >&2
              exit 1
            fi
            git rev-parse --verify "refs/tags/$release_tag^{commit}" >/dev/null
            checkout_ref="$release_tag"
          else
            checkout_ref="${{ github.sha }}"
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Validated version=$version ref=$checkout_ref publish=$publish"

  windows-release:
    name: Windows MSI and portable
    needs: validate_release
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate_release.outputs.checkout_ref }}
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
          modules: qtimageformats
          source: true
          src-archives: qtbase qtdeclarative qtimageformats
      - name: Build MSI
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-msi.ps1 -SkipSmoke -SkipAudit
      - name: Upload Windows release candidates
        uses: actions/upload-artifact@v6
        with:
          name: PicLens-Windows
          if-no-files-found: error
          path: |
            artifacts/qt-portable/PicLens-win-x64/**
            artifacts/installer/PicLens-${{ needs.validate_release.outputs.version }}-win-x64.msi

  linux-release:
    name: Debian installer and portable
    needs: validate_release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate_release.outputs.checkout_ref }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.3"
          cache: true
          modules: qtimageformats
          source: true
          src-archives: qtbase qtdeclarative qtimageformats
      - name: Build Debian installer
        run: bash scripts/build-deb.sh --no-test
      - name: Build Linux portable
        run: bash scripts/build-linux-portable.sh --no-test --skip-smoke
      - name: Upload Debian and portable release candidates
        uses: actions/upload-artifact@v6
        with:
          name: PicLens-Linux
          if-no-files-found: error
          path: |
            artifacts/qt-portable/PicLens-linux-x64/**
            artifacts/installer/**

  fedora-release:
    name: Fedora RPM installer
    needs: validate_release
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 45
    steps:
      - name: Install Fedora Qt and build dependencies
        run: >-
          dnf install --assumeyes
          git gcc-c++ cmake ninja-build python3 rpm-build
          qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtimageformats
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate_release.outputs.checkout_ref }}
      - name: Build RPM installer
        run: bash scripts/build-rpm.sh --no-test
      - name: Upload RPM installer
        uses: actions/upload-artifact@v6
        with:
          name: PicLens-Fedora-RPM
          if-no-files-found: error
          path: artifacts/installer/**

  publish-release:
    name: Publish GitHub Release assets
    needs:
      - validate_release
      - windows-release
      - linux-release
      - fedora-release
    if: needs.validate_release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate_release.outputs.checkout_ref }}
      - name: Download release candidates
        uses: actions/download-artifact@v7
        with:
          path: release-assets
      - name: Package release downloads and checksums
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p release-assets/publish
          (
            cd release-assets/PicLens-Windows/qt-portable
            zip -qr ../../publish/PicLens-win-x64-portable.zip PicLens-win-x64
          )
          tar -C release-assets/PicLens-Linux/qt-portable \
            -czf release-assets/publish/PicLens-linux-x64-portable.tar.gz \
            PicLens-linux-x64
          cp "release-assets/PicLens-Windows/installer/PicLens-${version}-win-x64.msi" \
            release-assets/publish/
          deb_name="$(python3 -c 'import json; print(json.load(open("release-assets/PicLens-Linux/installer/piclens-deb-manifest.json"))["file"])')"
          rpm_name="$(python3 -c 'import json; print(json.load(open("release-assets/PicLens-Fedora-RPM/installer/piclens-rpm-manifest.json"))["file"])')"
          cp "release-assets/PicLens-Linux/installer/$deb_name" release-assets/publish/
          cp "release-assets/PicLens-Fedora-RPM/installer/$rpm_name" release-assets/publish/
          (
            cd release-assets/publish
            sha256sum * > SHA256SUMS.txt
          )
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate_release.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/publish/*
