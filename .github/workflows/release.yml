name: Rust release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to rebuild and publish.
        required: true
        type: string

concurrency:
  group: rust-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Validate release context
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-11
      - name: Match tag to Cargo version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "piclens-gpui") | .version')"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not read the piclens-gpui package version." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG must match Cargo version v$version." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.name }}
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2025
            artifact: PicLens-Windows-x86_64
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: PicLens-Linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.tag }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-11
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked -p piclens-gpui
      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          $name = "PicLens-$env:VERSION-windows-x86_64"
          $stage = Join-Path dist $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/piclens-gpui.exe (Join-Path $stage PicLens.exe)
          Copy-Item LICENSE, README.md, assets/Fonts/NotoSansCJKtc-OFL.txt $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256" -Encoding ascii
      - name: Package Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          name="PicLens-$VERSION-linux-x86_64"
          stage="dist/$name"
          install -Dm755 target/release/piclens-gpui "$stage/PicLens"
          install -Dm644 LICENSE "$stage/LICENSE"
          install -Dm644 README.md "$stage/README.md"
          install -Dm644 assets/Fonts/NotoSansCJKtc-OFL.txt "$stage/NotoSansCJKtc-OFL.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs:
      - context
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.context.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.zip.sha256
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
