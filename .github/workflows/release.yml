name: Windows packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to rebuild and publish.
        required: true
        type: string

concurrency:
  group: windows-packages-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  windows:
    name: Build Windows MSI and portable ZIP
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with: { toolchain: nightly-2026-08-11 }
      - id: release
        name: Match annotated tag to Cargo version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $metadata = $metadataJson | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'piclens-desktop').version
          if ($env:RELEASE_TAG -cne "v$version") { throw "Tag $env:RELEASE_TAG must match v$version" }
          $tagType = git cat-file -t "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0 -or $tagType -ne 'tag') { throw "$env:RELEASE_TAG must be an annotated tag" }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build unsigned MSI
        run: ./scripts/build-msi.ps1 -Version '${{ steps.release.outputs.version }}'
      - name: Test MSI install, launch, replace, uninstall, and profile preservation
        run: ./scripts/test-msi-lifecycle.ps1 -MsiPath 'dist/PicLens-${{ steps.release.outputs.version }}-windows-x86_64.msi' -ConfirmSystemChanges
      - name: Build portable ZIP
        run: |
          $name = 'PicLens-${{ steps.release.outputs.version }}-windows-x86_64'
          $stage = Join-Path dist $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/piclens-desktop.exe (Join-Path $stage PicLens.exe)
          Copy-Item LICENSE, README.md, assets/Fonts/NotoSansCJKtc-OFL.txt $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: PicLens-Windows-x86_64
          if-no-files-found: error
          path: |
            dist/*.msi
            dist/*.msi.sha256
            dist/*.zip
            dist/*.zip.sha256
      - name: Publish unsigned GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: "These release assets are currently unsigned. SHA-256 checksum files are provided."
          files: |
            dist/*.msi
            dist/*.msi.sha256
            dist/*.zip
            dist/*.zip.sha256
