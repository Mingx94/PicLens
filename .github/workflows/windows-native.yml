name: Windows WPF release
on:
  push:
    tags: ['windows/v*']

concurrency:
  group: windows-wpf-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Match annotated tag to Windows version
        id: version
        run: |
          [xml]$props = Get-Content apps/windows/Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $expected = "windows/v$version"
          if ($env:GITHUB_REF_NAME -cne $expected) { throw "Tag must match $expected" }
          $tagType = git cat-file -t "refs/tags/$expected"
          if ($LASTEXITCODE -ne 0 -or $tagType -ne 'tag') { throw "Annotated tag required" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/windows/global.json
      - name: Build MSI and portable ZIP
        run: ./packaging/windows/build.ps1
      - name: Publish unsigned assets
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "dist/PicLens-$env:APP_VERSION-windows-x86_64"
          gh release create $env:GITHUB_REF_NAME "$name.msi" "$name.msi.sha256" "$name.zip" "$name.zip.sha256" --verify-tag --title "PicLens $env:APP_VERSION (Windows)" --notes "Windows WPF x64. Unsigned MSI and portable ZIP; SHA-256 files included. Automated functional and installer tests were not run."
          if ($LASTEXITCODE -ne 0) { throw "Release failed" }
