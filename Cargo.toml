[workspace]
resolver = "2"
members = [
    "crates/piclens-domain",
    "crates/piclens-infra",
    "crates/piclens-gpui",
]
default-members = ["crates/piclens-gpui"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
piclens-domain = { path = "crates/piclens-domain" }
piclens-infra = { path = "crates/piclens-infra" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
sysinfo = "0.31"
