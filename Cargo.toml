[workspace]
resolver = "2"
members = [
    "crates/piclens-domain",
    "crates/piclens-desktop",
    "crates/piclens-infra",
]
default-members = ["crates/piclens-desktop"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.2"

[workspace.dependencies]
piclens-domain = { path = "crates/piclens-domain" }
piclens-infra = { path = "crates/piclens-infra" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
sysinfo = "0.31"
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui = { version = "=0.36.1", default-features = false, features = ["default_fonts"] }
egui_kittest = { version = "=0.36.1", default-features = false }
rfd = "=0.17.2"

# Keep image decoding/resizing fast in `cargo run` too. Application code keeps
# the normal dev profile, including debug assertions and debug information.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package."zune-jpeg@0.5.15"]
opt-level = 3

[profile.dev.package."zune-core@0.5.3"]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package."png@0.18.1"]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
